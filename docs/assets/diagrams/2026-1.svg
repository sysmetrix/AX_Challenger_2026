<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img"><title>AX 챌린저 구성도</title><desc>2026-10-04 자료 대조. 파란색은 현행, 황색 점선은 차년도 검토안.</desc><g font-family="Malgun Gothic, 맑은 고딕, Noto Sans KR, sans-serif"><rect x="0" y="0" width="1600" height="1100" rx="0" fill="#FAF9FC" stroke="#FAF9FC" stroke-width="0"/><text x="60" y="28" font-size="19" fill="#724598" font-weight="700" dominant-baseline="text-before-edge">BWYF  /  AX CHALLENGER  /  01</text><text x="60" y="65" font-size="43" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">AX 챌린저 구성도</text><text x="60" y="132" font-size="23" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">현장 문제 발굴 → 공동 기반 정비·부서 실험·TF 협업 → 실제 활용과 문화 확산</text><rect x="1250" y="28" width="290" height="40" rx="10" fill="#F3F1F7" stroke="none" stroke-width="0"/><text x="1270" y="34" font-size="19" fill="#724598" font-weight="700" dominant-baseline="text-before-edge">2026 운영 구조</text><rect x="60" y="196" width="1480" height="112" rx="14" fill="#F3F1F7" stroke="#724598" stroke-width="1.6"/><text x="80" y="216" font-size="29" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">목적  |  업무 생산성 향상과 AX 조직문화 확산</text><text x="80" y="269.18" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">여성·청소년 사업 현장의 업무 문제를 내부 구성원이 직접 발견하고 개선</text><rect x="60" y="342" width="320" height="459" rx="14" fill="#EAF4EE" stroke="#156A3A" stroke-width="1.6"/><text x="80" y="362" font-size="29" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">참여 기반</text><text x="80" y="415.18" font-size="25" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">10개 부서 · 챌린저 15명</text><text x="80" y="452.18" font-size="25" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge"></text><text x="80" y="489.18" font-size="25" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">부서의 AI 활용 촉진</text><text x="80" y="526.1800000000001" font-size="25" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">작은 시도와 사례 축적</text><text x="80" y="563.1800000000001" font-size="25" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">동료 실습·사용 지원</text><text x="80" y="600.1800000000001" font-size="25" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge"></text><text x="80" y="637.1800000000001" font-size="25" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">전략경영실 운영 지원</text><rect x="420" y="342" width="358" height="340" rx="14" fill="#F3F1F7" stroke="#724598" stroke-width="1.6"/><text x="440" y="362" font-size="28" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">01  공동 기반</text><text x="440" y="413.76" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">HWPX 문서 체계 전환</text><text x="440" y="449.28" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">전 직원 AI 활용성 조사</text><text x="440" y="484.79999999999995" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">AI 활용 윤리 지침안</text><text x="440" y="520.3199999999999" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge"></text><text x="440" y="555.8399999999999" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">공통 기준·현황 마련</text><rect x="801" y="342" width="358" height="340" rx="14" fill="#F3F1F7" stroke="#724598" stroke-width="1.6"/><text x="821" y="362" font-size="28" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">02  부서별 실험·적용</text><text x="821" y="413.76" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">반복 입력·서식 자동화</text><text x="821" y="449.28" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">시설·이용자 서비스</text><text x="821" y="484.79999999999995" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">홍보콘텐츠·웹 아카이브</text><text x="821" y="520.3199999999999" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">공동실습·문화 확산</text><text x="821" y="555.8399999999999" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge"></text><text x="821" y="591.3599999999999" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">업무 여건에 맞춘 개선</text><rect x="1182" y="342" width="358" height="340" rx="14" fill="#F3F1F7" stroke="#724598" stroke-width="1.6"/><text x="1202" y="362" font-size="28" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">03  과제별 TF 협업</text><text x="1202" y="413.76" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">구글 AI 활용 안내 콘텐츠</text><text x="1202" y="449.28" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">수입행정 간소화</text><text x="1202" y="484.79999999999995" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">월간 업무보고 자동화</text><text x="1202" y="520.3199999999999" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge"></text><text x="1202" y="555.8399999999999" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">필요한 역량으로 공동 추진</text><polyline points="599,682 599,714" fill="none" stroke="#724598" stroke-width="2" stroke-linejoin="round"/><polygon points="599,714 593.9204290690437,704.2430558494278 604.0795709309563,704.2430558494278" fill="#724598"/><polyline points="980,682 980,714" fill="none" stroke="#724598" stroke-width="2" stroke-linejoin="round"/><polygon points="980,714 974.9204290690437,704.2430558494278 985.0795709309563,704.2430558494278" fill="#724598"/><polyline points="1361,682 1361,714" fill="none" stroke="#724598" stroke-width="2" stroke-linejoin="round"/><polygon points="1361,714 1355.9204290690436,704.2430558494278 1366.0795709309564,704.2430558494278" fill="#724598"/><rect x="420" y="714" width="1120" height="87" rx="14" fill="#EAF4EE" stroke="#156A3A" stroke-width="1.6"/><text x="440" y="734" font-size="27" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">공유·학습 허브  |  노션 자료·사례·회의 기록 + 정기모임</text><polyline points="800,801 800,841" fill="none" stroke="#724598" stroke-width="2" stroke-linejoin="round"/><polygon points="800,841 794.9204290690437,831.2430558494278 805.0795709309563,831.2430558494278" fill="#724598"/><rect x="420" y="843" width="1120" height="128" rx="14" fill="#EAF4EE" stroke="#156A3A" stroke-width="1.6"/><text x="440" y="863" font-size="28" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">현장 활용과 확산</text><text x="440" y="914.76" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">직원 업무에 적용 · 이용자 서비스 개선 · 사용 의견을 다음 개선에 반영</text><polyline points="420,907 396,907 396,540 380,540" fill="none" stroke="#156A3A" stroke-width="2" stroke-linejoin="round"/><polygon points="380,540 389.7569441505721,534.9204290690437 389.7569441505721,545.0795709309563" fill="#156A3A"/><text x="64" y="850" font-size="23" fill="#156A3A" font-weight="700" dominant-baseline="text-before-edge">역할 변화</text><text x="64" y="893" font-size="24" fill="#1F1F1F" font-weight="400" dominant-baseline="text-before-edge">개발 일괄 요구 →</text><text x="64" y="935" font-size="24" fill="#1F1F1F" font-weight="400" dominant-baseline="text-before-edge">부서 확산 + 필요 시 TF</text><polyline points="60,1020 1540,1020" fill="none" stroke="#D5DDE6" stroke-width="1" stroke-linejoin="round"/><text x="60" y="1037" font-size="18" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">근거: N01 협업 허브 · N17 6월 회의 · N02 9월 경과보고 · L04 수입행정 · L06 월간보고</text><text x="60" y="1066" font-size="17" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">세 축은 결과물과 활동을 이해하기 위한 분류이며, 고정 조직·상하 직제가 아님. 지침안은 공동 검토 단계.</text></g></svg>