<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img"><title>2027 AX 챌린저 협업 조직도</title><desc>2026-10-04 자료 분석. 전체 도식은 2027년 설계 제안이며 색은 기능을 구분한다.</desc><g font-family="Malgun Gothic, 맑은 고딕, Noto Sans KR, sans-serif"><rect x="0" y="0" width="1600" height="1100" rx="0" fill="#FAF9FC" stroke="#FAF9FC" stroke-width="0"/><text x="60" y="28" font-size="19" fill="#724598" font-weight="700" dominant-baseline="text-before-edge">BWYF  /  AX CHALLENGER  /  03</text><text x="60" y="65" font-size="43" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">2027 AX 챌린저 협업 조직도</text><text x="60" y="132" font-size="23" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">주관 기능을 중심으로 과제별 역할을 묶고, 부서 활용 지원과 서비스 유지관리를 연결</text><rect x="1250" y="28" width="290" height="40" rx="10" fill="#FDF5E8" stroke="none" stroke-width="0"/><text x="1270" y="34" font-size="19" fill="#C97A00" font-weight="700" dominant-baseline="text-before-edge">2027 추가 설계 제안</text><rect x="470" y="194" width="660" height="124" rx="14" fill="#FDF5E8" stroke="#C97A00" stroke-width="1.6"/><text x="490" y="214" font-size="29" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">운영 주관  |  전략경영실 중심 제안</text><text x="490" y="267.18" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">과제 선정·일정 조정·자원 관리·성과 점검</text><rect x="60" y="194" width="340" height="124" rx="14" fill="#EAF4EE" stroke="#156A3A" stroke-width="1.6"/><text x="80" y="214" font-size="26" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">협의 기능</text><text x="80" y="262.92" font-size="22" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">업무 책임 부서</text><rect x="1200" y="194" width="340" height="124" rx="14" fill="#EAF4EE" stroke="#156A3A" stroke-width="1.6"/><text x="1220" y="214" font-size="26" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">협의 기능</text><text x="1220" y="262.92" font-size="22" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">기관 보안·정보화 담당</text><polyline points="400,256 470,256" fill="none" stroke="#156A3A" stroke-width="2" stroke-linejoin="round"/><polygon points="470,256 460.2430558494279,261.0795709309563 460.2430558494279,250.92042906904368" fill="#156A3A"/><polyline points="1200,256 1130,256" fill="none" stroke="#156A3A" stroke-width="2" stroke-linejoin="round"/><polygon points="1130,256 1139.756944150572,250.92042906904368 1139.756944150572,261.0795709309563" fill="#156A3A"/><polyline points="800,318 800,357" fill="none" stroke="#C97A00" stroke-width="2" stroke-linejoin="round"/><polygon points="800,357 794.9204290690437,347.2430558494279 805.0795709309563,347.2430558494279" fill="#C97A00"/><rect x="60" y="359" width="1480" height="108" rx="14" fill="#FDF5E8" stroke="#C97A00" stroke-width="1.6"/><text x="80" y="379" font-size="28" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">과제별 협업팀  |  문제와 서비스의 책임자를 먼저 지정</text><text x="80" y="430.76" font-size="23" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">3~5명 역할 구성 제안 · 개발·현업 검증·확산·운영 역할 겸임 가능 · 최종 검증자는 개발자와 구별</text><rect x="60" y="501" width="355" height="253" rx="14" fill="#F3F1F7" stroke="#724598" stroke-width="1.6"/><text x="80" y="521" font-size="27" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">현업 과제 담당</text><text x="80" y="571.34" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">업무·예제자료·예외 설명</text><text x="80" y="606.86" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">시범 사용·원본 확인</text><text x="80" y="642.38" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">업무 적용 판단</text><rect x="435" y="501" width="355" height="253" rx="14" fill="#F3F1F7" stroke="#724598" stroke-width="1.6"/><text x="455" y="521" font-size="27" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">개발 참여자</text><text x="455" y="571.34" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">MVP 구현·오류 수정</text><text x="455" y="606.86" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">버전·변경 기록</text><text x="455" y="642.38" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">운영 방법 문서화</text><rect x="810" y="501" width="355" height="253" rx="14" fill="#F3F1F7" stroke="#724598" stroke-width="1.6"/><text x="830" y="521" font-size="27" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">확산 참여자</text><text x="830" y="571.34" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">동료 공동실습</text><text x="830" y="606.86" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">사용 안내·문의 취합</text><text x="830" y="642.38" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">반복 사용 확인</text><rect x="1185" y="501" width="355" height="253" rx="14" fill="#F3F1F7" stroke="#724598" stroke-width="1.6"/><text x="1205" y="521" font-size="27" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">운영·대체 담당</text><text x="1205" y="571.34" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">권한·계정·비용·백업</text><text x="1205" y="606.86" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">장애·복원·인수인계</text><text x="1205" y="642.38" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">부재 시 운영 대행</text><rect x="60" y="797" width="711" height="176" rx="14" fill="#EAF4EE" stroke="#156A3A" stroke-width="1.6"/><text x="80" y="817" font-size="28" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">부서 활용 촉진 네트워크</text><text x="80" y="868.76" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">기존 챌린저 경험을 필요에 따라 연계</text><text x="80" y="904.28" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">2기 신규 참여·부서 사용자와 공동실습</text><rect x="799" y="797" width="741" height="176" rx="14" fill="#EAF4EE" stroke="#156A3A" stroke-width="1.6"/><text x="819" y="817" font-size="28" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">운영 지원을 공유하는 서비스 담당자</text><text x="819" y="868.76" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">과제팀이 배포 후 운영 담당으로 연결</text><text x="819" y="904.28" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">월별 운영 확인 · 대체 담당 실습</text><polyline points="60,1020 1540,1020" fill="none" stroke="#D5DDE6" stroke-width="1" stroke-linejoin="round"/><text x="60" y="1037" font-size="18" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">원문 근거: L08 내부 자체개발·운영 관리 · N17 문화 확산 역할 · L04/L06 개발·현업 협업 사례</text><text x="60" y="1066" font-size="17" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">전체는 협업 조직 제안. 인원·개인별 위촉·직제 신설 미확정. 특정 2026 구성원에게 2027 역할을 자동 배정하지 않음.</text></g></svg>