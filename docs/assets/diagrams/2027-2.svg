<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img"><title>2027 AX 개발·운영 아키텍처</title><desc>2026-10-04 자료 분석. 전체 도식은 2027년 설계 제안이며 색은 기능을 구분한다.</desc><g font-family="Malgun Gothic, 맑은 고딕, Noto Sans KR, sans-serif"><rect x="0" y="0" width="1600" height="1100" rx="0" fill="#FAF9FC" stroke="#FAF9FC" stroke-width="0"/><text x="60" y="28" font-size="19" fill="#724598" font-weight="700" dominant-baseline="text-before-edge">BWYF  /  AX CHALLENGER  /  02</text><text x="60" y="65" font-size="43" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">2027 AX 개발·운영 아키텍처</text><text x="60" y="132" font-size="23" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">업무와 데이터 특성에 따라 실행 방식을 선택하고, 개발 보조 AI와 서비스의 AI 기능을 구별</text><rect x="1250" y="28" width="290" height="40" rx="10" fill="#FDF5E8" stroke="none" stroke-width="0"/><text x="1270" y="34" font-size="19" fill="#C97A00" font-weight="700" dominant-baseline="text-before-edge">2027 추가 설계 제안</text><rect x="60" y="194" width="1480" height="115" rx="14" fill="#FDF5E8" stroke="#C97A00" stroke-width="1.6"/><text x="80" y="214" font-size="29" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">설계 출발점  |  업무자료·서식·사용자·처리 범위 확인</text><text x="80" y="267.18" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">현업 설명 → 필수 입력·원본 대조 기준 합의 → 로컬 / 웹·공유 / AI 기능의 필요성 판단</text><text x="60" y="341" font-size="23" fill="#724598" font-weight="700" dominant-baseline="text-before-edge">업무자료</text><text x="495" y="341" font-size="23" fill="#724598" font-weight="700" dominant-baseline="text-before-edge">실행 방식별 구조</text><text x="1135" y="341" font-size="23" fill="#724598" font-weight="700" dominant-baseline="text-before-edge">사용·검증</text><text x="60" y="388" font-size="22" fill="#156A3A" font-weight="700" dominant-baseline="text-before-edge">A  파일·로컬 업무</text><rect x="60" y="423" width="385" height="116" rx="14" fill="white" stroke="#D5DDE6" stroke-width="1.6"/><text x="80" y="443" font-size="24" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">Excel·HWPX·원본 자료</text><rect x="495" y="423" width="590" height="116" rx="14" fill="#F3F1F7" stroke="#724598" stroke-width="1.6"/><text x="515" y="443" font-size="24" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">PC 실행 → 로컬 처리·저장</text><text x="515" y="477.08" font-size="24" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">버전 파일 + 별도 백업·복원</text><rect x="1135" y="423" width="405" height="116" rx="14" fill="white" stroke="#D5DDE6" stroke-width="1.6"/><text x="1155" y="443" font-size="24" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">생성 문서·집계</text><text x="1155" y="477.08" font-size="24" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">원본 대조 후 사용</text><polyline points="445,481 495,481" fill="none" stroke="#724598" stroke-width="2" stroke-linejoin="round"/><polygon points="495,481 485.2430558494279,486.0795709309563 485.2430558494279,475.9204290690437" fill="#724598"/><polyline points="1085,481 1135,481" fill="none" stroke="#724598" stroke-width="2" stroke-linejoin="round"/><polygon points="1135,481 1125.243055849428,486.0795709309563 1125.243055849428,475.9204290690437" fill="#724598"/><text x="60" y="563" font-size="22" fill="#156A3A" font-weight="700" dominant-baseline="text-before-edge">B  웹·공유 업무</text><rect x="60" y="598" width="385" height="116" rx="14" fill="white" stroke="#D5DDE6" stroke-width="1.6"/><text x="80" y="618" font-size="24" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">역할별 필요한 최소 자료</text><rect x="495" y="598" width="590" height="116" rx="14" fill="#F3F1F7" stroke="#724598" stroke-width="1.6"/><text x="515" y="618" font-size="24" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">웹 화면 → 사용자 인증·권한 → DB/API</text><text x="515" y="652.08" font-size="24" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">관리 기능은 서버 측에서 권한 확인</text><rect x="1135" y="598" width="405" height="116" rx="14" fill="white" stroke="#D5DDE6" stroke-width="1.6"/><text x="1155" y="618" font-size="24" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">공유 입력·확인·통계</text><text x="1155" y="652.08" font-size="24" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">업무 담당자 검증</text><polyline points="445,656 495,656" fill="none" stroke="#724598" stroke-width="2" stroke-linejoin="round"/><polygon points="495,656 485.2430558494279,661.0795709309563 485.2430558494279,650.9204290690437" fill="#724598"/><polyline points="1085,656 1135,656" fill="none" stroke="#724598" stroke-width="2" stroke-linejoin="round"/><polygon points="1135,656 1125.243055849428,661.0795709309563 1125.243055849428,650.9204290690437" fill="#724598"/><text x="60" y="738" font-size="22" fill="#156A3A" font-weight="700" dominant-baseline="text-before-edge">C  AI 기능 선택 적용</text><rect x="60" y="773" width="385" height="116" rx="14" fill="white" stroke="#D5DDE6" stroke-width="1.6"/><text x="80" y="793" font-size="24" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">승인된 공개·비식별 자료</text><rect x="495" y="773" width="590" height="116" rx="14" fill="#F3F1F7" stroke="#724598" stroke-width="1.6"/><text x="515" y="793" font-size="24" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">서버 측 호출 → AI API → 결과 초안</text><text x="515" y="827.08" font-size="24" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">비밀키 분리 · 사용량·비용 제한</text><rect x="1135" y="773" width="405" height="116" rx="14" fill="white" stroke="#D5DDE6" stroke-width="1.6"/><text x="1155" y="793" font-size="24" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">사람이 근거·내용 확인</text><text x="1155" y="827.08" font-size="24" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">최종 업무자료 반영</text><polyline points="445,831 495,831" fill="none" stroke="#724598" stroke-width="2" stroke-linejoin="round"/><polygon points="495,831 485.2430558494279,836.0795709309563 485.2430558494279,825.9204290690437" fill="#724598"/><polyline points="1085,831 1135,831" fill="none" stroke="#724598" stroke-width="2" stroke-linejoin="round"/><polygon points="1135,831 1125.243055849428,836.0795709309563 1125.243055849428,825.9204290690437" fill="#724598"/><rect x="60" y="938" width="1480" height="66" rx="14" fill="#EAF4EE" stroke="#156A3A" stroke-width="1.6"/><text x="80" y="958" font-size="25" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">공통 운영 기반  |  기관 계정·저장소 · 개발/검증/운영 구분 · 변경 기록 · 권한·비용 · 백업·복원</text><polyline points="60,1020 1540,1020" fill="none" stroke="#D5DDE6" stroke-width="1" stroke-linejoin="round"/><text x="60" y="1037" font-size="18" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">근거: L04 로컬 운영 · N13 웹/DB 사례 · L08 운영 고도화 · 보완 근거: Supabase API keys / OWASP Secrets Management</text><text x="60" y="1066" font-size="17" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">전체는 목표 구조 제안. AI 개발 보조는 검증용 예제로 활용하며 실제 업무자료의 AI 전송은 별도 판단. 특정 플랫폼 구매·통합 DB 전제 없음.</text></g></svg>