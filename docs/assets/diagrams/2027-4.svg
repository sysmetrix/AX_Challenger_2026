<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img"><title>2027 AX 과제 추진체계도</title><desc>2026-10-04 자료 분석. 전체 도식은 2027년 설계 제안이며 색은 기능을 구분한다.</desc><g font-family="Malgun Gothic, 맑은 고딕, Noto Sans KR, sans-serif"><rect x="0" y="0" width="1600" height="1100" rx="0" fill="#FAF9FC" stroke="#FAF9FC" stroke-width="0"/><text x="60" y="28" font-size="19" fill="#724598" font-weight="700" dominant-baseline="text-before-edge">BWYF  /  AX CHALLENGER  /  04</text><text x="60" y="65" font-size="43" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">2027 AX 과제 추진체계도</text><text x="60" y="132" font-size="23" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">선정·실제 업무 검증·운영 인계의 조건을 확인하면서 개발과 확산을 단계적으로 진행</text><rect x="1250" y="28" width="290" height="40" rx="10" fill="#FDF5E8" stroke="none" stroke-width="0"/><text x="1270" y="34" font-size="19" fill="#C97A00" font-weight="700" dominant-baseline="text-before-edge">2027 추가 설계 제안</text><rect x="60" y="206" width="464" height="196" rx="14" fill="#F3F1F7" stroke="#724598" stroke-width="1.6"/><text x="80" y="226" font-size="28" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">01  문제·현재 업무 확인</text><text x="80" y="277.76" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">현업: 과제카드·예제·기준선</text><text x="80" y="313.28" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">서식·절차 개선으로 해결 가능한가?</text><rect x="60" y="618" width="464" height="202" rx="14" fill="#F3F1F7" stroke="#724598" stroke-width="1.6"/><text x="80" y="638" font-size="28" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">06  활용 측정·재결정</text><text x="80" y="689.76" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">동일 범위 시간·오류·반복 사용</text><text x="80" y="725.28" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">운영 지속 / 보완 / 재사용 / 중단</text><rect x="568" y="206" width="464" height="196" rx="14" fill="#F3F1F7" stroke="#724598" stroke-width="1.6"/><text x="588" y="226" font-size="28" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">02  우선과제 선정</text><text x="588" y="277.76" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">주관·현업·개발·관련 기능 검토</text><text x="588" y="313.28" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">효과·재사용·자료·난도·유지관리</text><rect x="568" y="618" width="464" height="202" rx="14" fill="#F3F1F7" stroke="#724598" stroke-width="1.6"/><text x="588" y="638" font-size="28" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">05  제한 배포·사용 지원</text><text x="588" y="689.76" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">배포 대상·자료 범위·운영 책임 명시</text><text x="588" y="725.28" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">동료 실습·문의 안내·대체 절차</text><rect x="1076" y="206" width="464" height="196" rx="14" fill="#F3F1F7" stroke="#724598" stroke-width="1.6"/><text x="1096" y="226" font-size="28" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">03  8주 MVP 공동 제작</text><text x="1096" y="277.76" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">문제 정의 → 최소 기능 구현</text><text x="1096" y="313.28" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">개발 중에도 현업이 결과 확인</text><rect x="1076" y="618" width="464" height="202" rx="14" fill="#F3F1F7" stroke="#724598" stroke-width="1.6"/><text x="1096" y="638" font-size="28" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">04  실제 업무 시험·보완</text><text x="1096" y="689.76" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">정상·예외·원본·저장 도착 확인</text><text x="1096" y="725.28" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">입력 부담·실패·복구 점검</text><polyline points="524,302 568,302" fill="none" stroke="#724598" stroke-width="2" stroke-linejoin="round"/><polygon points="568,302 558.2430558494278,307.0795709309563 558.2430558494278,296.9204290690437" fill="#724598"/><polyline points="1032,302 1076,302" fill="none" stroke="#724598" stroke-width="2" stroke-linejoin="round"/><polygon points="1076,302 1066.243055849428,307.0795709309563 1066.243055849428,296.9204290690437" fill="#724598"/><polyline points="1308,402 1560,402 1560,598 1308,598 1308,618" fill="none" stroke="#724598" stroke-width="2" stroke-linejoin="round"/><polygon points="1308,618 1302.9204290690436,608.2430558494278 1313.0795709309564,608.2430558494278" fill="#724598"/><polyline points="1076,719 1032,719" fill="none" stroke="#724598" stroke-width="2" stroke-linejoin="round"/><polygon points="1032,719 1041.756944150572,713.9204290690437 1041.756944150572,724.0795709309563" fill="#724598"/><polyline points="568,719 524,719" fill="none" stroke="#724598" stroke-width="2" stroke-linejoin="round"/><polygon points="524,719 533.7569441505722,713.9204290690437 533.7569441505722,724.0795709309563" fill="#724598"/><polyline points="60,719 40,719 40,176 292,176 292,206" fill="none" stroke="#156A3A" stroke-width="2" stroke-linejoin="round" stroke-dasharray="8 6"/><polygon points="292,206 286.9204290690437,196.24305584942786 297.0795709309563,196.24305584942786" fill="#156A3A"/><rect x="60" y="445" width="464" height="128" rx="14" fill="#FDF5E8" stroke="#C97A00" stroke-width="1.6"/><text x="80" y="465" font-size="25" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">착수 조건  |  02→03</text><text x="80" y="512.5" font-size="22" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">현업 검증자·예제·자료 범위·개발 여력</text><rect x="568" y="445" width="464" height="128" rx="14" fill="#FDF5E8" stroke="#C97A00" stroke-width="1.6"/><text x="588" y="465" font-size="25" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">MVP 확인  |  03→04</text><text x="588" y="512.5" font-size="22" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">원본과 맞는 출력·예외 처리·부담 점검</text><rect x="1076" y="445" width="464" height="128" rx="14" fill="#FDF5E8" stroke="#C97A00" stroke-width="1.6"/><text x="1096" y="465" font-size="25" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">배포 조건  |  04→05</text><text x="1096" y="512.5" font-size="22" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">운영·대체 담당·권한·비용·복원 확인</text><rect x="60" y="865" width="1480" height="128" rx="14" fill="#EAF4EE" stroke="#156A3A" stroke-width="1.6"/><text x="80" y="885" font-size="27" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">공통 진행 방식  |  개발 진행 공유 + 업무별 공동실습 + 운영 기록</text><text x="80" y="935.34" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">착수·검증·배포 조건 미충족 시 해당 단계로 되돌아가 보완 · 일정 때문에 배포 완료로 처리하지 않음</text><polyline points="60,1020 1540,1020" fill="none" stroke="#D5DDE6" stroke-width="1" stroke-linejoin="round"/><text x="60" y="1037" font-size="18" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">원문 근거: L04 사용자 검증 · L06 서식/입력 부담 · N04 공동실습·저장 검증 사례 · L08 개발·운영</text><text x="60" y="1066" font-size="17" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">전체는 제안. MVP 제작 8주는 교육·개발 과정의 기준이며 실제 배포는 현장 사용 주기와 준비 조건에 따라 결정.</text></g></svg>