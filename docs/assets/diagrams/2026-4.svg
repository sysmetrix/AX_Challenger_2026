<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img"><title>AX 챌린저 추진체계도</title><desc>2026-10-04 자료 대조. 파란색은 현행, 황색 점선은 차년도 검토안.</desc><g font-family="Malgun Gothic, 맑은 고딕, Noto Sans KR, sans-serif"><rect x="0" y="0" width="1600" height="1100" rx="0" fill="#FAF9FC" stroke="#FAF9FC" stroke-width="0"/><text x="60" y="28" font-size="19" fill="#724598" font-weight="700" dominant-baseline="text-before-edge">BWYF  /  AX CHALLENGER  /  04</text><text x="60" y="65" font-size="43" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">AX 챌린저 추진체계도</text><text x="60" y="132" font-size="23" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">2026년의 부서 자율 실험·TF 협업을 바탕으로, 2기는 문제 정의부터 실제 활용까지 같은 과제로 협업</text><rect x="1250" y="28" width="290" height="40" rx="10" fill="#FDF5E8" stroke="none" stroke-width="0"/><text x="1270" y="34" font-size="19" fill="#C97A00" font-weight="700" dominant-baseline="text-before-edge">2027 추진 검토안</text><rect x="60" y="194" width="1480" height="117" rx="14" fill="#FDF5E8" stroke="#C97A00" stroke-width="1.6" stroke-dasharray="9 6"/><polyline points="74,194 1526,194" fill="none" stroke="#C97A00" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="8 6"/><polyline points="74,311 1526,311" fill="none" stroke="#C97A00" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="8 6"/><polyline points="60,208 60,297" fill="none" stroke="#C97A00" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="8 6"/><polyline points="1540,208 1540,297" fill="none" stroke="#C97A00" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="8 6"/><text x="80" y="214" font-size="28" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">과제별 협업 단위  |  개발 참여자 + 현업 검증·확산 참여자</text><text x="80" y="265.76" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">총괄·조정 / 업무 책임자 / 개발 담당 / 운영 담당·대체 담당의 책임 범위는 과제 선정 시 지정</text><rect x="60" y="355" width="440" height="180" rx="14" fill="#FDF5E8" stroke="#C97A00" stroke-width="1.6" stroke-dasharray="9 6"/><polyline points="74,355 486,355" fill="none" stroke="#C97A00" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="8 6"/><polyline points="74,535 486,535" fill="none" stroke="#C97A00" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="8 6"/><polyline points="60,369 60,521" fill="none" stroke="#C97A00" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="8 6"/><polyline points="500,369 500,521" fill="none" stroke="#C97A00" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="8 6"/><text x="80" y="375" font-size="27" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">01  문제 정의·과제 제안</text><text x="80" y="425.34" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">현업: 빈도·시간·서식·병목 정리</text><text x="80" y="460.85999999999996" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">산출물: 현재 업무 흐름·문제 명세</text><rect x="580" y="355" width="440" height="180" rx="14" fill="#FDF5E8" stroke="#C97A00" stroke-width="1.6" stroke-dasharray="9 6"/><polyline points="594,355 1006,355" fill="none" stroke="#C97A00" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="8 6"/><polyline points="594,535 1006,535" fill="none" stroke="#C97A00" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="8 6"/><polyline points="580,369 580,521" fill="none" stroke="#C97A00" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="8 6"/><polyline points="1020,369 1020,521" fill="none" stroke="#C97A00" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="8 6"/><text x="600" y="375" font-size="27" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">02  우선과제 선정</text><text x="600" y="425.34" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">총괄·현업·개발 공동 검토</text><text x="600" y="460.85999999999996" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">기준: 부담·재사용·구현성·보안</text><rect x="1100" y="355" width="440" height="180" rx="14" fill="#FDF5E8" stroke="#C97A00" stroke-width="1.6" stroke-dasharray="9 6"/><polyline points="1114,355 1526,355" fill="none" stroke="#C97A00" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="8 6"/><polyline points="1114,535 1526,535" fill="none" stroke="#C97A00" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="8 6"/><polyline points="1100,369 1100,521" fill="none" stroke="#C97A00" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="8 6"/><polyline points="1540,369 1540,521" fill="none" stroke="#C97A00" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="8 6"/><text x="1120" y="375" font-size="27" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">03  MVP 제작</text><text x="1120" y="425.34" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">개발: 최소 기능의 시제품 구현</text><text x="1120" y="460.85999999999996" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">현업: 실제 서식·예외 조건 제공</text><rect x="1100" y="606" width="440" height="180" rx="14" fill="#FDF5E8" stroke="#C97A00" stroke-width="1.6" stroke-dasharray="9 6"/><polyline points="1114,606 1526,606" fill="none" stroke="#C97A00" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="8 6"/><polyline points="1114,786 1526,786" fill="none" stroke="#C97A00" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="8 6"/><polyline points="1100,620 1100,772" fill="none" stroke="#C97A00" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="8 6"/><polyline points="1540,620 1540,772" fill="none" stroke="#C97A00" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="8 6"/><text x="1120" y="626" font-size="27" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">04  현장 검증·보완</text><text x="1120" y="676.34" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">현업: 실제 업무로 시험·오류 기록</text><text x="1120" y="711.86" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">개발: 이중 입력·불편·오류 개선</text><rect x="580" y="606" width="440" height="180" rx="14" fill="#FDF5E8" stroke="#C97A00" stroke-width="1.6" stroke-dasharray="9 6"/><polyline points="594,606 1006,606" fill="none" stroke="#C97A00" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="8 6"/><polyline points="594,786 1006,786" fill="none" stroke="#C97A00" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="8 6"/><polyline points="580,620 580,772" fill="none" stroke="#C97A00" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="8 6"/><polyline points="1020,620 1020,772" fill="none" stroke="#C97A00" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="8 6"/><text x="600" y="626" font-size="27" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">05  배포·사용 지원</text><text x="600" y="676.34" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">업무·운영 담당: 적용 준비 확인</text><text x="600" y="711.86" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">설명서·짧은 실습·대체 절차 마련</text><rect x="60" y="606" width="440" height="180" rx="14" fill="#FDF5E8" stroke="#C97A00" stroke-width="1.6" stroke-dasharray="9 6"/><polyline points="74,606 486,606" fill="none" stroke="#C97A00" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="8 6"/><polyline points="74,786 486,786" fill="none" stroke="#C97A00" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="8 6"/><polyline points="60,620 60,772" fill="none" stroke="#C97A00" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="8 6"/><polyline points="500,620 500,772" fill="none" stroke="#C97A00" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="8 6"/><text x="80" y="626" font-size="27" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">06  활용 측정·환류</text><text x="80" y="676.34" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">실사용자·반복 사용·시간·오류</text><text x="80" y="711.86" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">타부서 재사용 → 개선 과제 반영</text><polyline points="500,445 580,445" fill="none" stroke="#C97A00" stroke-width="2" stroke-linejoin="round"/><polygon points="580,445 570.2430558494278,450.0795709309563 570.2430558494278,439.9204290690437" fill="#C97A00"/><polyline points="1020,445 1100,445" fill="none" stroke="#C97A00" stroke-width="2" stroke-linejoin="round"/><polygon points="1100,445 1090.243055849428,450.0795709309563 1090.243055849428,439.9204290690437" fill="#C97A00"/><polyline points="1320,535 1320,606" fill="none" stroke="#C97A00" stroke-width="2" stroke-linejoin="round"/><polygon points="1320,606 1314.9204290690436,596.2430558494278 1325.0795709309564,596.2430558494278" fill="#C97A00"/><polyline points="1100,696 1020,696" fill="none" stroke="#C97A00" stroke-width="2" stroke-linejoin="round"/><polygon points="1020,696 1029.756944150572,690.9204290690437 1029.756944150572,701.0795709309563" fill="#C97A00"/><polyline points="580,696 500,696" fill="none" stroke="#C97A00" stroke-width="2" stroke-linejoin="round"/><polygon points="500,696 509.7569441505721,690.9204290690437 509.7569441505721,701.0795709309563" fill="#C97A00"/><polyline points="60,696 40,696 40,333 280,333 280,355" fill="none" stroke="#C97A00" stroke-width="2" stroke-linejoin="round" stroke-dasharray="8 6"/><polygon points="280,355 274.9204290690437,345.2430558494279 285.0795709309563,345.2430558494279" fill="#C97A00"/><text x="64" y="578" font-size="21" fill="#C97A00" font-weight="700" dominant-baseline="text-before-edge">업무 재설계·다음 과제 반영</text><text x="1100" y="557" font-size="21" fill="#C97A00" font-weight="700" dominant-baseline="text-before-edge">실제 업무로 검증</text><rect x="60" y="830" width="1480" height="151" rx="14" fill="#FDF5E8" stroke="#C97A00" stroke-width="1.6" stroke-dasharray="9 6"/><polyline points="74,830 1526,830" fill="none" stroke="#C97A00" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="8 6"/><polyline points="74,981 1526,981" fill="none" stroke="#C97A00" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="8 6"/><polyline points="60,844 60,967" fill="none" stroke="#C97A00" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="8 6"/><polyline points="1540,844 1540,967" fill="none" stroke="#C97A00" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="8 6"/><text x="80" y="850" font-size="28" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">모든 단계의 공통 운영 기반</text><text x="80" y="901.76" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">기관 소유 도구·계정·API  /  데이터 취급·접근권한  /  변경 기록·비용·장애 점검</text><text x="80" y="937.28" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">백업·복원 확인  /  사용·운영 설명서·인수인계  /  6월·12월 점검</text><polyline points="60,1020 1540,1020" fill="none" stroke="#D5DDE6" stroke-width="1" stroke-linejoin="round"/><text x="60" y="1037" font-size="18" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">근거: N17 역할 재정의 · L04 현장 검증 사례 · L06 업무 재설계 과제 · L08 2027 사업계획안 · 사용자 제시 방향</text><text x="60" y="1066" font-size="17" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">MVP = 핵심 기능을 확인하는 최소 시제품. 전 과정은 추진 검토안이며, 2기 인원·운영 역할·선정 과제는 미확정.</text></g></svg>