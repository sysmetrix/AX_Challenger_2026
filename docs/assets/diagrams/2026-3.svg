<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img"><title>AX 챌린저 협업 운영조직도</title><desc>2026-10-04 자료 대조. 파란색은 현행, 황색 점선은 차년도 검토안.</desc><g font-family="Malgun Gothic, 맑은 고딕, Noto Sans KR, sans-serif"><rect x="0" y="0" width="1600" height="1100" rx="0" fill="#FAF9FC" stroke="#FAF9FC" stroke-width="0"/><text x="60" y="28" font-size="19" fill="#724598" font-weight="700" dominant-baseline="text-before-edge">BWYF  /  AX CHALLENGER  /  03</text><text x="60" y="65" font-size="43" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">AX 챌린저 협업 운영조직도</text><text x="60" y="132" font-size="23" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">위촉 명단 15명 전원 + 운영 지원 + 과제별 협업 역할 | 소속 부서는 명단·경과보고 표기 기준</text><rect x="1250" y="28" width="290" height="40" rx="10" fill="#F3F1F7" stroke="none" stroke-width="0"/><text x="1270" y="34" font-size="19" fill="#724598" font-weight="700" dominant-baseline="text-before-edge">2026 운영 인력</text><rect x="60" y="196" width="470" height="123" rx="14" fill="#EAF4EE" stroke="#156A3A" stroke-width="1.6"/><text x="80" y="216" font-size="27" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">운영 주관  |  전략경영실</text><text x="80" y="266.34000000000003" font-size="25" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">전략기획부 · 서원하 운영·조정</text><polyline points="530,257 575,257" fill="none" stroke="#156A3A" stroke-width="2" stroke-linejoin="round"/><polygon points="575,257 565.2430558494278,262.0795709309563 565.2430558494278,251.92042906904368" fill="#156A3A"/><rect x="575" y="196" width="965" height="123" rx="14" fill="#F3F1F7" stroke="#724598" stroke-width="1.6"/><text x="595" y="216" font-size="29" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">부서별 챌린저 네트워크  |  10개 부서 · 15명</text><text x="595" y="269.18" font-size="25" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">현장 문제 발굴 · 활용 사례 공유 · 동료 지