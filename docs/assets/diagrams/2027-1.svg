<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img"><title>2027 AX 챌린저 구성도</title><desc>2026-10-04 자료 분석. 전체 도식은 2027년 설계 제안이며 색은 기능을 구분한다.</desc><g font-family="Malgun Gothic, 맑은 고딕, Noto Sans KR, sans-serif"><rect x="0" y="0" width="1600" height="1100" rx="0" fill="#FAF9FC" stroke="#FAF9FC" stroke-width="0"/><text x="60" y="28" font-size="19" fill="#724598" font-weight="700" dominant-baseline="text-before-edge">BWYF  /  AX CHALLENGER  /  01</text><text x="60" y="65" font-size="43" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">2027 AX 챌린저 구성도</text><text x="60" y="132" font-size="23" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">기존 서비스의 안정적 활용 + 현장 과제의 자체 개발 + 부서의 AX 활용 지원을 하나의 운영 과정으로 연결</text><rect x="1250" y="28" width="290" height="40" rx="10" fill="#FDF5E8" stroke="none" stroke-width="0"/><text x="1270" y="34" font-size="19" fill="#C97A00" font-weight="700" dominant-baseline="text-before-edge">2027 추가 설계 제안</text><rect x="60" y="194" width="1480" height="116" rx="14" fill="#FDF5E8" stroke="#C97A00" stroke-width="1.6"/><text x="80" y="214" font-size="29" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">운영 목표  |  직접 개선하고, 실제로 쓰며, 담당자가 바뀌어도 지속되는 AX</text><text x="80" y="267.18" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">2026년 부서 확산·자체 개발 경험 → 2027년 과제별 개발·검증·확산·운영 책임 연결</text><rect x="60" y="352" width="464" height="351" rx="14" fill="#F3F1F7" stroke="#724598" stroke-width="1.6"/><text x="80" y="372" font-size="28" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">01  기존 서비스 안정화</text><text x="80" y="423.76" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">KPI·수입행정·현장 웹서비스</text><text x="80" y="459.28" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">계정·자료·비용·권한 현황 정리</text><text x="80" y="494.79999999999995" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">오류·백업·복원·인수인계 점검</text><text x="80" y="530.3199999999999" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge"></text><text x="80" y="565.8399999999999" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">운영 서비스부터 책임 명확화</text><rect x="568" y="352" width="464" height="351" rx="14" fill="#F3F1F7" stroke="#724598" stroke-width="1.6"/><text x="588" y="372" font-size="28" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">02  과제 중심 2기 협업</text><text x="588" y="423.76" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">반복업무 문제와 예제자료 확보</text><text x="588" y="459.28" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">개발 + 현업 검증·확산 참여</text><text x="588" y="494.79999999999995" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">8주 MVP → 현장 시험·보완</text><text x="588" y="530.3199999999999" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge"></text><text x="588" y="565.8399999999999" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">연간 시범과제 2건 이내 제안</text><rect x="1076" y="352" width="464" height="351" rx="14" fill="#F3F1F7" stroke="#724598" stroke-width="1.6"/><text x="1096" y="372" font-size="28" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">03  업무별 활용·재사용</text><text x="1096" y="423.76" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">안전교육일지·출석부 재사용</text><text x="1096" y="459.28" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">짧은 공동실습·문의 지원</text><text x="1096" y="494.79999999999995" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">안내 콘텐츠·사례·서식 공유</text><text x="1096" y="530.3199999999999" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge"></text><text x="1096" y="565.8399999999999" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">반복 사용과 타부서 적용 확인</text><rect x="60" y="739" width="1480" height="103" rx="14" fill="#EAF4EE" stroke="#156A3A" stroke-width="1.6"/><text x="80" y="759" font-size="28" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">공통 기반  |  서비스·과제 대장 · 기관 소유 계정/저장소 · 자료 기준 · 변경·비용·사용 기록</text><polyline points="292.0,703 292.0,739" fill="none" stroke="#724598" stroke-width="2" stroke-linejoin="round"/><polygon points="292.0,739 286.9204290690437,729.2430558494278 297.0795709309563,729.2430558494278" fill="#724598"/><polyline points="800.0,703 800.0,739" fill="none" stroke="#724598" stroke-width="2" stroke-linejoin="round"/><polygon points="800.0,739 794.9204290690437,729.2430558494278 805.0795709309563,729.2430558494278" fill="#724598"/><polyline points="1308.0,703 1308.0,739" fill="none" stroke="#724598" stroke-width="2" stroke-linejoin="round"/><polygon points="1308.0,739 1302.9204290690436,729.2430558494278 1313.0795709309564,729.2430558494278" fill="#724598"/><polyline points="800,842 800,874" fill="none" stroke="#156A3A" stroke-width="2" stroke-linejoin="round"/><polygon points="800,874 794.9204290690437,864.2430558494278 805.0795709309563,864.2430558494278" fill="#156A3A"/><rect x="60" y="875" width="1480" height="118" rx="14" fill="#FDF5E8" stroke="#C97A00" stroke-width="1.6"/><text x="80" y="895" font-size="28" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">점검·환류  |  사용 여부와 업무 변화로 다음 결정을 내림</text><text x="80" y="946.76" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">계속 운영 / 보완 / 타부서 적용 / 중단·보관 → 6월·12월 점검에서 재조정</text><polyline points="60,1020 1540,1020" fill="none" stroke="#D5DDE6" stroke-width="1" stroke-linejoin="round"/><text x="60" y="1037" font-size="18" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">원문 근거: L08 2027 사업계획안 · L04 수입행정 · L06 월간보고 · N04 공동실습 · N17 역할 변화</text><text x="60" y="1066" font-size="17" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">전체는 설계 제안. 연간 시범 2건 이내·8주 과정은 운영 여력을 고려한 추가 제안이며 기존 승인 사업량이 아님.</text></g></svg>