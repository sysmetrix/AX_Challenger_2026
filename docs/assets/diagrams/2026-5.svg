xt-before-edge">예산  |  1,200만 원은 예산요구액 · 2기 모집 일정·인원·접수 경로와 세부 과제는 추후 확정</text><polyline points="60,1020 1540,1020" fill="none" stroke="#D5DDE6" stroke-width="1" stroke-linejoin="round"/><text x="60" y="1037" font-size="18" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">근거: L02 위촉 결과 · N17 6월 회의 · N02 9월 경과보고 · L04/L06 적용·시제품 · L08 2027 사업계획안</text><text x="60" y="1066" font-size="17" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">2026년 10월 6일은 예정 일정. 2027년 점선 구간은 추진 검토안이며 확정 예산·승인 일정으로 해석하지 않음.</text></g></svg>