<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img"><title>2027 AX 챌린저 실행 로드맵</title><desc>2026-10-04 자료 분석. 전체 도식은 2027년 설계 제안이며 색은 기능을 구분한다.</desc><g font-family="Malgun Gothic, 맑은 고딕, Noto Sans KR, sans-serif"><rect x="0" y="0" width="1600" height="1100" rx="0" fill="#FAF9FC" stroke="#FAF9FC" stroke-width="0"/><text x="60" y="28" font-size="19" fill="#724598" font-weight="700" dominant-baseline="text-before-edge">BWYF  /  AX CHALLENGER  /  05</text><text x="60" y="65" font-size="43" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">2027 AX 챌린저 실행 로드맵</text><text x="60" y="132" font-size="23" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">상반기에는 운영 기반과 첫 시범, 하반기에는 점검 결과를 반영한 다음 과제와 운영 인계를 진행</text><rect x="1250" y="28" width="290" height="40" rx="10" fill="#FDF5E8" stroke="none" stroke-width="0"/><text x="1270" y="34" font-size="19" fill="#C97A00" font-weight="700" dominant-baseline="text-before-edge">2027 추가 설계 제안</text><rect x="60" y="194" width="1480" height="112" rx="14" fill="#FDF5E8" stroke="#C97A00" stroke-width="1.6"/><text x="80" y="214" font-size="28" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">실행량 제안  |  연간 신규·재설계 시범과제 2건 이내 · 초기 동시 신규 개발 1건</text><text x="80" y="265.76" font-size="24" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">기존 서비스 유지관리와 재사용은 연중 병행 · 개발자·현업 검증자의 업무시간 확보 후 착수</text><rect x="60" y="349" width="1480" height="518" rx="14" fill="white" stroke="#D5DDE6" stroke-width="1"/><text x="468" y="368" font-size="22" fill="#5E6672" font-weight="700" dominant-baseline="text-before-edge">1월</text><text x="557" y="368" font-size="22" fill="#5E6672" font-weight="700" dominant-baseline="text-before-edge">2월</text><polyline points="539,411 539,841" fill="none" stroke="#EEEAF3" stroke-width="1" stroke-linejoin="round"/><text x="646" y="368" font-size="22" fill="#5E6672" font-weight="700" dominant-baseline="text-before-edge">3월</text><polyline points="628,411 628,841" fill="none" stroke="#EEEAF3" stroke-width="1" stroke-linejoin="round"/><text x="735" y="368" font-size="22" fill="#5E6672" font-weight="700" dominant-baseline="text-before-edge">4월</text><polyline points="717,411 717,841" fill="none" stroke="#EEEAF3" stroke-width="1" stroke-linejoin="round"/><text x="824" y="368" font-size="22" fill="#5E6672" font-weight="700" dominant-baseline="text-before-edge">5월</text><polyline points="806,411 806,841" fill="none" stroke="#EEEAF3" stroke-width="1" stroke-linejoin="round"/><text x="913" y="368" font-size="22" fill="#5E6672" font-weight="700" dominant-baseline="text-before-edge">6월</text><polyline points="895,411 895,841" fill="none" stroke="#EEEAF3" stroke-width="1" stroke-linejoin="round"/><text x="1002" y="368" font-size="22" fill="#5E6672" font-weight="700" dominant-baseline="text-before-edge">7월</text><polyline points="984,411 984,841" fill="none" stroke="#EEEAF3" stroke-width="1" stroke-linejoin="round"/><text x="1091" y="368" font-size="22" fill="#5E6672" font-weight="700" dominant-baseline="text-before-edge">8월</text><polyline points="1073,411 1073,841" fill="none" stroke="#EEEAF3" stroke-width="1" stroke-linejoin="round"/><text x="1180" y="368" font-size="22" fill="#5E6672" font-weight="700" dominant-baseline="text-before-edge">9월</text><polyline points="1162,411 1162,841" fill="none" stroke="#EEEAF3" stroke-width="1" stroke-linejoin="round"/><text x="1269" y="368" font-size="22" fill="#5E6672" font-weight="700" dominant-baseline="text-before-edge">10월</text><polyline points="1251,411 1251,841" fill="none" stroke="#EEEAF3" stroke-width="1" stroke-linejoin="round"/><text x="1358" y="368" font-size="22" fill="#5E6672" font-weight="700" dominant-baseline="text-before-edge">11월</text><polyline points="1340,411 1340,841" fill="none" stroke="#EEEAF3" stroke-width="1" stroke-linejoin="round"/><text x="1447" y="368" font-size="22" fill="#5E6672" font-weight="700" dominant-bas