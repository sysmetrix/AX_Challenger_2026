oin="round" stroke-dasharray="8 6"/><polyline points="1345,686 1345,712" fill="none" stroke="#C97A00" stroke-width="1.4" stroke-linejoin="round" stroke-dasharray="8 6"/><polyline points="1513,686 1513,712" fill="none" stroke="#C97A00" stroke-width="1.4" stroke-linejoin="round" stroke-dasharray="8 6"/><text x="80" y="748" font-size="23" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">유지관리·실습·사용 지원</text><rect x="455" y="738" width="1058" height="44" rx="9" fill="#FDF5E8" stroke="#C97A00" stroke-width="1.4" stroke-dasharray="9 6"/><polyline points="464,738 1504,738" fill="none" stroke="#C97A00" stroke-width="1.4" stroke-linejoin="round" stroke-dasharray="8 6"/><polyline points="464,782 1504,782" fill="none" stroke="#C97A00" stroke-width="1.4" stroke-linejoin="round" stroke-dasharray="8 6"/><polyline points="455,747 455,773" fill="none" stroke="#C97A00" stroke-width="1.4" stroke-linejoin="round" stroke-dasharray="8 6"/><polyline points="1513,747 1513,773" fill="none" stroke="#C97A00" stroke-width="1.4" stroke-linejoin="round" stroke-dasharray="8 6"/><text x="467" y="748" font-size="21" fill="#C97A00" font-weight="700" dominant-baseline="text-before-edge">변경·비용·권한·백업·문의 / 부서 업무별 공동실습</text><text x="80" y="807" font-size="23" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">6월·12월 점검</text><rect x="900" y="800" width="79" height="44" rx="9" fill="#EAF4EE" stroke="#156A3A" stroke-width="1.4"/><text x="917" y="810" font-size="21" fill="#156A3A" font-weight="700" dominant-baseline="text-before-edge">점검</text><rect x="1434" y="800" width="79" height="44" rx="9" fill="#EAF4EE" stroke="#156A3A" stroke-width="1.4"/><text x="1451" y="810" font-size="21" fill="#156A3A" font-weight="700" dominant-baseline="text-before-edge">점검</text><rect x="60" y="903" width="1480" height="89" rx="14" fill="#EAF4EE" stroke="#156A3A" stroke-width="1.6"/><text x="80" y="923" font-size="27" fill="#1F1F1F" font-weight="700" dominant-baseline="text-before-edge">6월 결정  |  기존 서비스·첫 시범 성과 확인 → 다음 과제 범위·일정 재조정</text><polyline points="60,1020 1540,1020" fill="none" stroke="#D5DDE6" stroke-width="1" stroke-linejoin="round"/><text x="60" y="1037" font-size="18" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">원문 일정: L08 1~2월 준비 · 2~3월 선정 · 3~11월 개발 · 연중 유지관리 · 6/12월 점검</text><text x="60" y="1066" font-size="17" fill="#5E6672" font-weight="400" dominant-baseline="text-before-edge">두 차수·8주 과정·동시 1건·연간 2건 이내는 추가 설계 제안이며 역할 확보에 맞춰 조정.</text></g></svg>